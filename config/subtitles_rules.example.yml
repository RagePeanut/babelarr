# Optional readable form of SUBTITLES_RULES.
# Mount this file and set: SUBTITLES_RULES=/config/subtitles_rules.yml
#
# Rules are an ORDERED list. At runtime Babelarr walks them TOP TO BOTTOM and
# the FIRST matching key wins -- that rule is authoritative (it never falls
# through to a later rule, not even `default`). Declaration ORDER MATTERS.
#
# Each key is the content/played-audio language -- a language code, a script
# class, `xx`/`silent` (silent / no-dialogue titles), or `default`.
# The value is an ordered list of subtitle preferences; the first one that is
# actually present on the file wins. Reserved tokens for subtitles:
#   off       -> force subtitles OFF
# (Subtitles have no `original` token: rules key on the played audio, so
#  concrete language keys plus `default` already cover every case.)
#
# If a matched rule's preferences are ALL missing, subtitles are left UNTOUCHED
# (Plex decides) -- this is different from `off`, which explicitly disables them.
# If NO rule matches (and there is no `default`), subtitles are left untouched.
#
# Language codes may be given in any ISO 639 form (fr / fre / fra all work).
rules:
  - silent: [off]          # silent / no-dialogue films -> no subtitles
  - eng: [fre]             # English audio -> French subs, else untouched
  - fre: [off]             # French audio  -> subtitles explicitly OFF
  - default: [fre, eng]    # anything else -> French, then English, else untouched
