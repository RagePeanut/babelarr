services:
  # Lingarr - automatic Plex audio/subtitle track selection
  lingarr:
    image: ghcr.io/ragepeanut/lingarr:latest   # or: build: .
    container_name: lingarr
    environment:
      - TZ=Europe/Paris
      # Plex (Plex runs on the NAS host itself -> use the NAS LAN IP, not localhost)
      - PLEX_URL=http://192.168.1.10:32400
      - PLEX_TOKEN=xxxxxxxxxxxxxxxxxxxx
      # Leave PLEX_LIBRARIES unset to process ALL movie + show libraries,
      # or restrict with a comma-separated list of library names:
      # - PLEX_LIBRARIES=Movies,TV Shows
      # TMDB - authoritative source of each title's original language
      - TMDB_API_KEY=xxxxxxxxxxxxxxxxxxxx
      # Subtitle rules. Either an inline string (shown here) OR a path to a
      # mounted YAML file, e.g. SUBTITLE_RULES=/config/subtitle_rules.yml
      #   eng:fre        -> English audio  -> French subs, else OFF (no fallback)
      #   fre:           -> French audio   -> subtitles OFF
      #   default:fre,eng-> anything else  -> French, then English, else OFF
      - SUBTITLE_RULES=eng:fre;fre:;default:fre,eng
      # Optional audio-quality ceiling by channel count (6 = 5.1). Picks the
      # best matching-language track with channels <= this. Unset = no cap.
      - MAX_AUDIO_CHANNELS=6
      # Always-on full-library sweep cadence (minutes).
      - SWEEP_INTERVAL_MINUTES=360
      # How new media is caught between sweeps: webhook | polling | disabled
      #   webhook  -> requires Plex Pass; instant on library.new (needs the port below)
      #   polling  -> no Plex Pass; scans recently-added on an interval
      #   disabled -> rely solely on the full sweep (default)
      - NEW_MEDIA_MODE=webhook
      - WEBHOOK_PORT=9999
      - RECENT_POLL_INTERVAL_MINUTES=15
      # Log intended changes without applying them.
      - DRY_RUN=false
    dns: [1.1.1.1, 8.8.8.8]
    # Only needed when NEW_MEDIA_MODE=webhook. Point Plex's webhook at
    # http://<NAS-IP>:9999  (Settings -> Webhooks in Plex, requires Plex Pass).
    ports:
      - 9999:9999
    # Optional: only needed if SUBTITLE_RULES points at a mounted YAML file.
    volumes:
      - /volume1/docker/lingarr:/config
    restart: unless-stopped
